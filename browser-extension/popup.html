<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AURA Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #f3f4f6;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge.disconnected {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .media-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .media-card.empty {
      justify-content: center;
      color: #9ca3af;
      font-size: 12px;
      padding: 18px 12px;
    }
    .artwork {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #1e2029;
    }
    .info {
      flex: 1;
      min-width: 0;
    }
    .track-title {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .status-note {
      margin-top: 12px;
      font-size: 10px;
      color: #6b7280;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>AURA</span>
      <span style="font-size: 10px; color: #f59e0b;">COMPANION</span>
    </div>
    <div id="statusBadge" class="badge disconnected">Checking...</div>
  </div>

  <div id="mediaContainer" class="media-card empty">
    No media detected in active tab
  </div>

  <div class="status-note">
    Synchronizes YouTube, Spotify Web & HTML5 audio with AURA mini player.
  </div>

  <script src="popup.js"></script>
</body>
</html>
